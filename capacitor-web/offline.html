<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f6f1" />
    <title>교집합</title>
    <style>
      :root {
        color: #24211f;
        background: #f8f6f1;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
      }
      main {
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #77716c;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>연결을 확인해주세요.</h1>
      <p>인터넷에 연결되면 교집합을 다시 실행해주세요.</p>
    </main>
  </body>
</html>
